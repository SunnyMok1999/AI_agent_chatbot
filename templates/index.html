<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agent Chatbot</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-icon">🤖</div>
      <div>
        <h1>AI Agent Chatbot</h1>
        <p class="subtitle">Powered by OpenAI &mdash; ask me anything!</p>
      </div>
    </header>

    <div class="tool-badges">
      <span class="badge">🧮 Calculator</span>
      <span class="badge">🕒 Date &amp; Time</span>
      <span class="badge">🔍 Web Search</span>
      <span class="badge">📐 Unit Converter</span>
    </div>

    <div id="messages" class="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

    <div id="typing-indicator" class="typing-indicator hidden" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>

    <form id="chat-form" class="input-area" autocomplete="off">
      <textarea
        id="user-input"
        class="input-box"
        placeholder="Type a message… (Enter to send, Shift+Enter for new line)"
        rows="1"
        aria-label="Message input"
      ></textarea>
      <button type="submit" class="send-btn" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
